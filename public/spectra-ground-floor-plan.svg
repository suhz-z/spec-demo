<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="group" aria-labelledby="title desc">
  <title id="title">Ground floor plan</title>
  <desc id="desc">Schematic villa ground floor layout with kitchen, work area, bedroom, dining, living room, study, services, sit-out and car porch. Room groups are keyboard focusable and expose their room name and dimensions.</desc>
  <style>
    .plan-boundary { fill:#f7f9f5; stroke:#d7e0d5; stroke-width:1.5; }
    .room-shape { fill:#fff; stroke:#829085; stroke-width:1.8; vector-effect:non-scaling-stroke; transition:fill .16s ease,stroke .16s ease,stroke-width .16s ease; }
    .room-shape.service { fill:#f1f4ee; }
    .room-shape.outside { fill:#edf1ea; stroke:#aebcaf; stroke-dasharray:5 4; }
    .room-group { cursor:pointer; outline:none; }
    .room-group:hover .room-shape,
    .room-group:focus-visible .room-shape,
    .room-group.active .room-shape { fill:#dfeadf; stroke:#315e48; stroke-width:2.6; }
    .room-name { fill:#435247; font:600 13px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; pointer-events:none; }
    .room-size { fill:#89968b; font:10.5px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; pointer-events:none; }
    .orientation { fill:#879388; font:500 10px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:1.5px; text-anchor:middle; }
    @media (prefers-reduced-motion:reduce) { .room-shape { transition:none; } }
  </style>
  <rect x="0" y="0" width="800" height="560" fill="#f0f3ed"/>
  <rect class="plan-boundary" x="45" y="25" width="635" height="470" rx="4"/>

  <g class="room-group" id="room-kitchen" data-room="kitchen" tabindex="0" role="button" aria-label="Kitchen, 13′ × 12′, 156 sq.ft">
    <rect class="room-shape" x="70" y="48" width="178" height="130" />
    <text class="room-name" x="159" y="109" style="font-size:13px">Kitchen</text>
    <text class="room-size" x="159" y="128">13′ × 12′</text>
  </g>
  <g class="room-group" id="room-work" data-room="work" tabindex="0" role="button" aria-label="Work area, 7′ × 12′, 84 sq.ft">
    <rect class="room-shape service" x="248" y="48" width="96" height="130" />
    <text class="room-name" x="296" y="109" style="font-size:11.5px">Work area</text>
    <text class="room-size" x="296" y="128">7′ × 12′</text>
  </g>
  <g class="room-group" id="room-bed1" data-room="bed1" tabindex="0" role="button" aria-label="Bedroom 1, 13′ × 12′, 156 sq.ft">
    <rect class="room-shape" x="344" y="48" width="178" height="130" />
    <text class="room-name" x="433" y="109" style="font-size:13px">Bedroom 1</text>
    <text class="room-size" x="433" y="128">13′ × 12′</text>
  </g>
  <g class="room-group" id="room-bath1" data-room="bath1" tabindex="0" role="button" aria-label="Bath 1, 7′ × 12′, 84 sq.ft">
    <rect class="room-shape service" x="522" y="48" width="96" height="130" />
    <text class="room-name" x="570" y="109" style="font-size:11.5px">Bath 1</text>
    <text class="room-size" x="570" y="128">7′ × 12′</text>
  </g>
  <g class="room-group" id="room-dining" data-room="dining" tabindex="0" role="button" aria-label="Dining, 14′ × 10′, 140 sq.ft">
    <rect class="room-shape" x="70" y="178" width="190" height="108" />
    <text class="room-name" x="165" y="228" style="font-size:13px">Dining</text>
    <text class="room-size" x="165" y="247">14′ × 10′</text>
  </g>
  <g class="room-group" id="room-living" data-room="living" tabindex="0" role="button" aria-label="Living room, 18′ × 18′, 324 sq.ft">
    <rect class="room-shape" x="260" y="178" width="240" height="194" />
    <text class="room-name" x="380" y="271" style="font-size:13px">Living room</text>
    <text class="room-size" x="380" y="290">18′ × 18′</text>
  </g>
  <g class="room-group" id="room-study" data-room="study" tabindex="0" role="button" aria-label="Study, 8′ × 9′, 72 sq.ft">
    <rect class="room-shape" x="500" y="178" width="118" height="97" />
    <text class="room-name" x="559" y="222.5" style="font-size:13px">Study</text>
    <text class="room-size" x="559" y="241.5">8′ × 9′</text>
  </g>
  <g class="room-group" id="room-toilet" data-room="toilet" tabindex="0" role="button" aria-label="Common toilet, 8′ × 9′, 72 sq.ft">
    <rect class="room-shape service" x="500" y="275" width="118" height="97" />
    <text class="room-name" x="559" y="319.5" style="font-size:13px">Common toilet</text>
    <text class="room-size" x="559" y="338.5">8′ × 9′</text>
  </g>
  <g class="room-group" id="room-stair" data-room="stair" tabindex="0" role="button" aria-label="Staircase, 8′ × 8′, 64 sq.ft">
    <rect class="room-shape service" x="70" y="286" width="105" height="86" />
    <text class="room-name" x="122.5" y="325" style="font-size:11.5px">Staircase</text>
    <text class="room-size" x="122.5" y="344">8′ × 8′</text>
  </g>
  <g class="room-group" id="room-foyer" data-room="foyer" tabindex="0" role="button" aria-label="Foyer, 6′ × 8′, 48 sq.ft">
    <rect class="room-shape service" x="175" y="286" width="85" height="86" />
    <text class="room-name" x="217.5" y="325" style="font-size:11.5px">Foyer</text>
    <text class="room-size" x="217.5" y="344">6′ × 8′</text>
  </g>
  <g class="room-group" id="room-sitout" data-room="sitout" tabindex="0" role="button" aria-label="Sit-out, 14′ × 6′, 84 sq.ft">
    <rect class="room-shape outside" x="175" y="372" width="190" height="55" />
    <text class="room-name" x="270" y="395.5" style="font-size:13px">Sit-out</text>
    <text class="room-size" x="270" y="414.5">14′ × 6′</text>
  </g>
  <g class="room-group" id="room-porch" data-room="porch" tabindex="0" role="button" aria-label="Car porch, 16′ × 16′, 256 sq.ft">
    <rect class="room-shape outside" x="405" y="372" width="213" height="110" />
    <text class="room-name" x="511.5" y="423" style="font-size:13px">Car porch</text>
    <text class="room-size" x="511.5" y="442">16′ × 16′</text>
  </g>
  <text class="orientation" x="360" y="528">FRONT / ROAD SIDE</text>
</svg>
