<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="group" aria-labelledby="title desc">
  <title id="title">First floor plan</title>
  <desc id="desc">Schematic villa first floor layout with master bedroom, bedroom, family lounge, home office, service rooms and balcony. Room groups are keyboard focusable and expose their room name and dimensions.</desc>
  <style>
    .plan-boundary { fill:#f7f9f5; stroke:#d7e0d5; stroke-width:1.5; }
    .room-shape { fill:#fff; stroke:#829085; stroke-width:1.8; vector-effect:non-scaling-stroke; transition:fill .16s ease,stroke .16s ease,stroke-width .16s ease; }
    .room-shape.service { fill:#f1f4ee; }
    .room-shape.outside { fill:#edf1ea; stroke:#aebcaf; stroke-dasharray:5 4; }
    .room-group { cursor:pointer; outline:none; }
    .room-group:hover .room-shape,
    .room-group:focus-visible .room-shape,
    .room-group.active .room-shape { fill:#dfeadf; stroke:#315e48; stroke-width:2.6; }
    .room-name { fill:#435247; font:600 13px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; pointer-events:none; }
    .room-size { fill:#89968b; font:10.5px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; pointer-events:none; }
    .orientation { fill:#879388; font:500 10px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:1.5px; text-anchor:middle; }
    @media (prefers-reduced-motion:reduce) { .room-shape { transition:none; } }
  </style>
  <rect x="0" y="0" width="800" height="560" fill="#f0f3ed"/>
  <rect class="plan-boundary" x="45" y="25" width="635" height="470" rx="4"/>

  <g class="room-group" id="room-master" data-room="master" tabindex="0" role="button" aria-label="Master bedroom, 16′ × 14′, 224 sq.ft">
    <rect class="room-shape" x="70" y="48" width="218" height="150" />
    <text class="room-name" x="179" y="119" style="font-size:13px">Master bedroom</text>
    <text class="room-size" x="179" y="138">16′ × 14′</text>
  </g>
  <g class="room-group" id="room-wardrobe" data-room="wardrobe" tabindex="0" role="button" aria-label="Walk-in, 6′ × 7′, 42 sq.ft">
    <rect class="room-shape service" x="288" y="48" width="105" height="75" />
    <text class="room-name" x="340.5" y="81.5" style="font-size:11.5px">Walk-in</text>
    <text class="room-size" x="340.5" y="100.5">6′ × 7′</text>
  </g>
  <g class="room-group" id="room-mbath" data-room="mbath" tabindex="0" role="button" aria-label="Master bath, 6′ × 7′, 42 sq.ft">
    <rect class="room-shape service" x="288" y="123" width="105" height="75" />
    <text class="room-name" x="340.5" y="156.5" style="font-size:11.5px">Master bath</text>
    <text class="room-size" x="340.5" y="175.5">6′ × 7′</text>
  </g>
  <g class="room-group" id="room-bed2" data-room="bed2" tabindex="0" role="button" aria-label="Bedroom 2, 12′ × 14′, 168 sq.ft">
    <rect class="room-shape" x="393" y="48" width="165" height="150" />
    <text class="room-name" x="475.5" y="119" style="font-size:13px">Bedroom 2</text>
    <text class="room-size" x="475.5" y="138">12′ × 14′</text>
  </g>
  <g class="room-group" id="room-bath2" data-room="bath2" tabindex="0" role="button" aria-label="Bath 2, 6′ × 14′, 84 sq.ft">
    <rect class="room-shape service" x="558" y="48" width="95" height="150" />
    <text class="room-name" x="605.5" y="119" style="font-size:11.5px">Bath 2</text>
    <text class="room-size" x="605.5" y="138">6′ × 14′</text>
  </g>
  <g class="room-group" id="room-store" data-room="store" tabindex="0" role="button" aria-label="Linen store, 8′ × 8′, 64 sq.ft">
    <rect class="room-shape service" x="70" y="198" width="110" height="86" />
    <text class="room-name" x="125" y="237" style="font-size:11.5px">Linen store</text>
    <text class="room-size" x="125" y="256">8′ × 8′</text>
  </g>
  <g class="room-group" id="room-stair2" data-room="stair2" tabindex="0" role="button" aria-label="Staircase, 8′ × 8′, 64 sq.ft">
    <rect class="room-shape service" x="70" y="284" width="110" height="86" />
    <text class="room-name" x="125" y="323" style="font-size:11.5px">Staircase</text>
    <text class="room-size" x="125" y="342">8′ × 8′</text>
  </g>
  <g class="room-group" id="room-lounge" data-room="lounge" tabindex="0" role="button" aria-label="Family lounge, 22′ × 16′, 352 sq.ft">
    <rect class="room-shape" x="180" y="198" width="270" height="172" />
    <text class="room-name" x="315" y="280" style="font-size:13px">Family lounge</text>
    <text class="room-size" x="315" y="299">22′ × 16′</text>
  </g>
  <g class="room-group" id="room-office" data-room="office" tabindex="0" role="button" aria-label="Home office, 10′ × 16′, 160 sq.ft">
    <rect class="room-shape" x="450" y="198" width="203" height="172" />
    <text class="room-name" x="551.5" y="280" style="font-size:13px">Home office</text>
    <text class="room-size" x="551.5" y="299">10′ × 16′</text>
  </g>
  <g class="room-group" id="room-balcony" data-room="balcony" tabindex="0" role="button" aria-label="Balcony, 22′ × 5′, 110 sq.ft">
    <rect class="room-shape outside" x="180" y="370" width="270" height="55" />
    <text class="room-name" x="315" y="393.5" style="font-size:13px">Balcony</text>
    <text class="room-size" x="315" y="412.5">22′ × 5′</text>
  </g>
  <text class="orientation" x="360" y="528">FRONT / ROAD SIDE</text>
</svg>
