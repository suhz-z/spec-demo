  <!-- Select a plot by click, Enter or Space when the SVG is embedded inline. -->
  <script><![CDATA[
    (() => {
      const plots = Array.from(document.querySelectorAll('.plot-group'));
      const selectPlot = (plot) => {
        plots.forEach((item) => item.classList.toggle('selected', item === plot));
        document.dispatchEvent(new CustomEvent('plotselect', {
          bubbles: true,
          detail: { plotId: plot.dataset.plot }
        }));
      };
      plots.forEach((plot) => {
        plot.addEventListener('click', () => selectPlot(plot));
        plot.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectPlot(plot);
          }
        });
      });
    })();
  ]]></script>
