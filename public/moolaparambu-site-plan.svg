  <title id="title">Moolaparambu - six plot land subdivision plan</title>
  <desc id="desc">A traced site subdivision drawing showing six plots, the central internal access road, the approach at the southern end, north direction, dimensions and source-listed plot areas.</desc>
  <metadata>Vector trace of the supplied MOOLAPARAMBU 2.pdf, page 1. Plot areas and road area are reproduced as printed in the source drawing. Dimensions are reproduced without adding units not stated in the source.</metadata>
