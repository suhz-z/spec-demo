      .plot-shape { stroke: #536459; stroke-width: .72; stroke-linejoin: round; transition: fill .16s ease, stroke-width .16s ease; }
      .plot-a { fill: #eef3ec; }
      .plot-b { fill: #f5f7f2; }
      .plot-group { cursor: pointer; outline: none; }
      .plot-group:hover .plot-shape,
      .plot-group:focus .plot-shape,
      .plot-group:focus-visible .plot-shape,
      .plot-group.selected .plot-shape { fill: #dce9dc; stroke: #245b43; stroke-width: 1.45; }
      .plot-label { fill: #bd4c42; font: 700 8.8px Georgia, 'Times New Roman', serif; text-anchor: middle; dominant-baseline: middle; pointer-events: none; letter-spacing: .12px; }
      .area-label { fill: #66756a; font: 500 5.1px Arial, sans-serif; text-anchor: middle; letter-spacing: .18px; }
      .dimension { fill: #46554a; font: 500 5.15px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle;  }
      .road { fill: #e7ebe4; stroke: #7d8a7d; stroke-width: .7; stroke-linejoin: round; }
      .road-centre { fill: none; stroke: #fff; stroke-width: .7; stroke-dasharray: 4 3; opacity: .9; }
      .approach { fill: none; stroke: #bd4aa5; stroke-width: 1.05; stroke-linecap: round; stroke-linejoin: round; }
      .minor { fill: #7e8b80; font: 500 5px Arial, sans-serif; letter-spacing: .55px; }
      .heading { fill: #34463a; font: 600 7px Arial, sans-serif; letter-spacing: .95px; }
      .subheading { fill: #8a968c; font: 500 4.9px Arial, sans-serif; letter-spacing: .6px; }
      .north { fill: #315e48; stroke: #315e48; }
      .north-label { fill: #315e48; font: 700 8px Georgia, serif; text-anchor: middle; }
      .legend-label { fill: #657268; font: 500 4.9px Arial, sans-serif; }
      @media (prefers-reduced-motion: reduce) { .plot-shape { transition: none; } }
